<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  
  <!-- Brain/Memory icon -->
  <g transform="translate(50, 50)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="8" fill="#ef4444" opacity="0.9"/>
    
    <!-- Connected nodes -->
    <circle cx="-20" cy="-15" r="5" fill="#f87171" opacity="0.8"/>
    <circle cx="20" cy="-15" r="5" fill="#f87171" opacity="0.8"/>
    <circle cx="-20" cy="15" r="5" fill="#f87171" opacity="0.8"/>
    <circle cx="20" cy="15" r="5" fill="#f87171" opacity="0.8"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-20" y2="-15" stroke="#f87171" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="20" y2="-15" stroke="#f87171" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="-20" y2="15" stroke="#f87171" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="20" y2="15" stroke="#f87171" stroke-width="2" opacity="0.6"/>
    
    <!-- Outer nodes -->
    <circle cx="-30" cy="-25" r="3" fill="#fca5a5" opacity="0.7"/>
    <circle cx="30" cy="-25" r="3" fill="#fca5a5" opacity="0.7"/>
    <circle cx="-30" cy="25" r="3" fill="#fca5a5" opacity="0.7"/>
    <circle cx="30" cy="25" r="3" fill="#fca5a5" opacity="0.7"/>
    
    <!-- Outer connection lines -->
    <line x1="-20" y1="-15" x2="-30" y2="-25" stroke="#fca5a5" stroke-width="1.5" opacity="0.5"/>
    <line x1="20" y1="-15" x2="30" y2="-25" stroke="#fca5a5" stroke-width="1.5" opacity="0.5"/>
    <line x1="-20" y1="15" x2="-30" y2="25" stroke="#fca5a5" stroke-width="1.5" opacity="0.5"/>
    <line x1="20" y1="15" x2="30" y2="25" stroke="#fca5a5" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Letter D -->
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>
</svg>
